name: Release

# A tag v<version> builds, signs and publishes a GitHub Release.
#
# - Stable (v0.2.0): the latest release. Apps on the stable channel update
#   from https://github.com/<repo>/releases/latest/download/latest.json.
# - Pilot (v0.2.0-pilot.N): a pre-release that is never "latest". Its
#   latest.json is also uploaded to the rolling pre-release `pilot`, which apps
#   on the pilot channel read: .../releases/download/pilot/latest.json.
# - Any other pre-release (v0.2.0-rc.1): a pre-release that no channel reads.
#
# The updater signing key is required. Apple and Windows code signing switch
# on with their secrets; until then pilot builds are unsigned (internal pilot).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches the app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      pilot: ${{ steps.v.outputs.pilot }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          app=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$app" ] || [ "$version" != "$crate" ]; then
            echo "::error::tag $tag does not match tauri.conf.json $app and Cargo.toml $crate"
            exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          case "$version" in *-pilot.*) pilot=true ;; *) pilot=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "pilot=$pilot" >> "$GITHUB_OUTPUT"
      - name: latest.json builder self-test
        run: python3 -I scripts/latest_json.py --self-test

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build-app.yml
    with:
      release: true
    secrets: inherit

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: lazurio-agent-desktop-*
      - name: Release files and latest.json
        run: python3 -I scripts/latest_json.py artifacts release "${{ needs.version.outputs.version }}" --repo "${{ github.repository }}"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Lazurio Agent Desktop $VERSION" \
            --notes "Lazurio Agent Desktop $VERSION. Installed apps update themselves from this release." \
            "${flags[@]}"
      - name: Point the pilot channel at this release
        if: needs.version.outputs.pilot == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view pilot >/dev/null 2>&1; then
            gh release create pilot \
              --target "$GITHUB_SHA" \
              --prerelease --latest=false \
              --title "Lazurio Agent Desktop: pilot channel" \
              --notes "Rolling pre-release for the pilot update channel. Its latest.json points at the newest pilot release; the packages live in that release. Not for manual download."
          fi
          gh release upload pilot release/latest.json --clobber
          gh release view pilot --json assets --jq '.assets[].name'
