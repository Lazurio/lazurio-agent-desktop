name: Release

# A tag v<version> builds, signs and publishes a GitHub Release. Installed apps
# update from latest.json of the newest release that is not a pre-release
# (https://github.com/<repo>/releases/latest/download/latest.json), so a tag with
# a pre-release part (v0.2.0-rc.1) is published as a pre-release and never
# reaches them. Apple and Windows code signing switch on with their secrets;
# the updater signing key is required.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches the app version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          app=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$version" != "$app" ] || [ "$version" != "$crate" ]; then
            echo "::error::tag $tag does not match tauri.conf.json $app and Cargo.toml $crate"
            exit 1
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - name: latest.json builder self-test
        run: python3 -I scripts/latest_json.py --self-test

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build-app.yml
    with:
      release: true
    secrets: inherit

  publish:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: lazurio-agent-desktop-*
      - name: Release files and latest.json
        run: python3 -I scripts/latest_json.py artifacts release "${{ needs.version.outputs.version }}" --repo "${{ github.repository }}"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--latest)
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Lazurio Agent Desktop $VERSION" \
            --notes "Lazurio Agent Desktop $VERSION. Installed apps update themselves from this release." \
            "${flags[@]}"
