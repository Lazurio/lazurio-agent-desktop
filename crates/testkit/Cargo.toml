[package]
name        = "lazurio-agent-desktop-testkit"
description = "Fake Launchpad, fake Environment attach and fake engine for the core's end-to-end tests"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true

[dependencies]
lazurio-agent-desktop-core.workspace = true
serde_json.workspace = true
base64.workspace     = true
url.workspace        = true
ureq = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
ssh-key   = { version = "0.6", features = ["ed25519", "std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[[bin]]
name = "fake-engine"
path = "src/bin/fake_engine.rs"

[[bin]]
name = "fake-attach"
path = "src/bin/fake_attach.rs"
