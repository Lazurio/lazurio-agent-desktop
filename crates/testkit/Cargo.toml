[package]
name        = "lazurio-agent-desktop-testkit"
description = "Fake Launchpad, fake Environment (attach over WebSocket) and fake engine for the core's end-to-end tests"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true

[dependencies]
lazurio-agent-desktop-core.workspace = true
serde_json.workspace = true
base64.workspace     = true
url.workspace        = true
ureq = { version = "2", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ed25519-dalek = "2"
ssh-key   = { version = "0.6", features = ["ed25519", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "fake-engine"
path = "src/bin/fake_engine.rs"
