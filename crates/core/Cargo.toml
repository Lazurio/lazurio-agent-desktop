[package]
name         = "lazurio-agent-desktop-core"
description  = "Pairing, channel and switch of Lazurio Agent Desktop, without any user interface"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
publish.workspace      = true
license.workspace      = true

[dependencies]
serde.workspace      = true
serde_json.workspace = true
thiserror.workspace  = true
base64.workspace     = true
url.workspace        = true
zeroize.workspace    = true
ssh-key   = { version = "0.6", features = ["ed25519", "std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
gethostname = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
ed25519-dalek = "2"
os_info = { version = "3", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
tempfile = "3"
